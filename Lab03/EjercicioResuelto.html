<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Viewport obligatorio para Mobile First -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Resuelto - Lab 03</title>
    
    <!-- CDN CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

                </ul>
            </div>

    <!-- Ejemplo de prueba para ver la rejilla (.card-grid) funcionando -->

        <div class="card-grid">
            <div class="card p-3 shadow-sm">Tarjeta 1</div>
