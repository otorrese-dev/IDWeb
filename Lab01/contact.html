<main>
    <h1>Contacto</h1>
    <p>¿Tienes alguna duda o comentario sobre este portafolio? Envía un mensaje a través del siguiente formulario básico:</p>

    <!-- Formulario básico no funcional requerido por la guía -->
    <form action="#" method="POST">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
        
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" placeholder="correo@unsa.edu.pe" required>
        
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        
        <button type="submit">Enviar Mensaje</button>
    </form>
</main>

<footer>
