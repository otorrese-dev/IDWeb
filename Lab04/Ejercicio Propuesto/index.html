<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas Académicas</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
    background-color: #e8ffff;
}
    </style>
</head>

<body>
<main class="container-fluid my-4 px-4">
    
    <h2 class="text-center mb-4">Gestor de Tareas Universitarias</h2>
    <div class="row g-4">   
        <div class="col-12 col-md-4">
    <div class="card p-4 shadow-sm bg-white border-light sticky-top" style="top: 20px;">   
        <form id="form-tarea">  
            <h4 class="mb-4 text-primary fw-semibold">Registrar Tarea</h4> 
            <!-- título de la tarea -->
            <div class="mb-3">
                <label for="tituloInput" class="form-label text-secondary small">Título</label>
                <input type="text" id="tituloInput" class="form-control" placeholder="Ej. Informe de Laboratorio">
            </div>
            <!-- curso de la tarea -->
            <div class="mb-3">
                <label for="cursoSelect" class="form-label text-secondary small">Curso</label>
                <select id="cursoSelect" class="form-select">
                    <option value="" disabled selected>Seleccione un curso</option>
                    <option value="Estructuras Discretas II">Estructuras Discretas II</option>
                    <option value="Realidad Nacional">Realidad Nacional</option>
                    <option value="Cálculo en una Variable">Cálculo en una Variable</option>
                    <option value="Introducción al Desarrollo Web">Introducción al Desarrollo Web</option>
                    <option value="Desarrollo de Software Orientado a Objetos">Desarrollo de Software Orientado a Objetos</option>
                </select>
            </div>
            <!-- fecha límite de la tarea -->
            <div class="mb-4">
                <label for="fechaInputLimit" class="form-label text-secondary small">Fecha Límite</label>
                <input type="date" id="fechaInputLimit" class="form-control">
            </div>
            <!-- botón para guardar la tarea -->
            <button type="submit" class="btn btn-primary w-100 fw-medium shadow-sm">Guardar Tarea</button>
        </form>
    </div>

    
    </div>
        <!-- barra de navegación de filtros con contador, alertas y lista de tareas -->
        <div class="col-12 col-md-8">
            <ul class="nav nav-tabs mb-3" id="filtros"> 
                <li class="nav-item">
                    <button class="nav-link active" data-filtro="todas">
                        TODAS <span class="badge bg-secondary" id="cant-todas">0</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-filtro="pendientes">
                        PENDIENTES <span class="badge bg-warning text-dark" id="cant-pendientes">0</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-filtro="completadas">
                        COMPLETADAS <span class="badge bg-success" id="cant-completadas">0</span>
                    </button>
                </li>
            </ul>

            <!-- sección de alertas -->
            <div id="alerta-error"></div>
            
            <!-- contenedor lista de tareas -->
            <div id="lista-tareas" class="d-flex flex-column gap-3"></div>
            
            <!-- botón para vaciar todas las tareas -->
            <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-outline-danger btn-sm" onclick="vaciarTodasLasTareas()">
                    Borrar Todo el Historial
                </button>
            </div>
        </div>
    </div>
</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
