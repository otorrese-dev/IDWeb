<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas Académicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<main class="container-fluid my-4 px-4">
    <h2 class="text-center mb-4">Gestor de Tareas Universitarias</h2>

    <div class="row g-4">
        
        <div class="col-12 col-md-4">
            <div class="card p-4 shadow-sm sticky-top" style="top: 20px;">
                <form id="form-tarea">
                    <h4 class="mb-3">Registrar Tarea</h4>
                    
                    <div class="mb-3">
                        <label for="tituloInput" class="form-label">Título</label>
                        <input type="text" id="tituloInput" class="form-control" placeholder="Ej. Laboratorio 04">
                    </div>

                    <div class="mb-3">
                        <label for="cursoSelect" class="form-label">Curso</label>
                        <select id="cursoSelect" class="form-select">
                            <option value="" disabled selected>Seleccione un curso</option>
                            <option value="Estructuras Discretas II">Estructuras Discretas II</option>
                            <option value="Realidad Nacional">Realidad Nacional</option>
                            <option value="Cálculo en una Variable">Cálculo en una Variable</option>
                            <option value="Introducción al Desarrollo Web">Introducción al Desarrollo Web</option>
                            <option value="Desarrollo de Software Orientado a Objetos">Desarrollo de Software Orientado a Objetos</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="fechaInputLimit" class="form-label">Fecha Límite</label>
                        <input type="date" id="fechaInputLimit" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Guardar Tarea</button>
                </form>
            </div>
        </div>

        <div class="col-12 col-md-8">
            
            <ul class="nav nav-tabs mb-3" id="filtros">
                <li class="nav-item">
                    <button class="nav-link active" data-filtro="todas">
                        TODAS <span class="badge bg-secondary" id="cant-todas">0</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-filtro="pendientes">
                        PENDIENTES <span class="badge bg-warning text-dark" id="cant-pendientes">0</span>
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-filtro="completadas">
                        COMPLETADAS <span class="badge bg-success" id="cant-completadas">0</span>
                    </button>
                </li>
            </ul>

            <div id="alerta-error"></div>

            <div id="lista-tareas" class="d-flex flex-column gap-3">
                </div>

        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
