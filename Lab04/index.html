<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas Académicas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<main class="container my-4" style="max-width: 700px;">
    <h2 class="text-center mb-4">Gestor de Tareas Universitarias</h2>

    <!-- 1. FILTROS VISUALES (Todas / Pendientes / Completadas) -->
    <ul class="nav nav-tabs mb-4" id="filtros">
        <li class="nav-item">
            <button class="nav-link active" data-filtro="todas">TODAS</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-filtro="pendientes">PENDIENTES</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-filtro="completadas">COMPLETADAS</button>
        </li>
    </ul>

    <!-- 2. FORMULARIO DE REGISTRO -->
    <div class="card p-4 shadow-sm mb-4">
        <form id="form-tarea">
            <h4 class="mb-3">Registrar Tarea Pendiente</h4>
            
            <div class="mb-3">
                <label for="tituloInput" class="form-label">Título</label>
                <input type="text" id="tituloInput" class="form-control" placeholder="Ej. Laboratorio 04">
            </div>

            <div class="mb-3">
                <label for="cursoSelect" class="form-label">Curso</label>
                <select id="cursoSelect" class="form-select">
                    <option value="" disabled selected>Seleccione un curso</option>
                    <option value="Estructuras Discretas II">Estructuras Discretas II</option>
                    <option value="Realidad Nacional">Realidad Nacional</option>
                    <option value="Cálculo en una Variable">Cálculo en una Variable</option>
                    <option value="Desarrollo Web">Introducción al Desarrollo Web</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="fechaInput" class="form-label">Fecha Límite</label>
                <input type="date" id="fechaInput" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar Tarea</button>
        </form>
    </div>

    <!-- 3. CONTENEDOR DE ALERTAS DINÁMICAS -->
    <div id="alerta-error"></div>

    <!-- 4. CONTENEDOR DONDE JAVASCRIPT RENDERIZARÁ LAS TARJETAS -->
    <div id="lista-tareas" class="d-flex flex-column gap-3">
        <!-- JS generará las tarjetas aquí -->
    </div>
</main>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tu archivo JavaScript -->
<script src="app.js"></script>

</body>
</html>
