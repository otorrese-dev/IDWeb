<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostración Profe - Laboratorio 04</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light p-4">

    <div class="container" style="max-width: 600px;">
        <h2 class="text-center mb-4">Gestor de Tareas </h2>

        <!-- Formulario para agregar tareas -->
        <form id="todo-form" class="mb-4">
            <div class="input-group">
                <input type="text" id="todo-input" class="form-control" placeholder="Escribe una tarea..." required>
                <button class="btn btn-primary" type="submit">Agregar</button>
            </div>
        </form>

        <!-- Lista donde se insertarás las tareas dinámicamente -->
        <ul id="todo-list" class="list-group">
            <!-- JavaScript meterá los <li> aquí -->
        </ul>
    </div>

    <!-- Script -->
    <script src="ejercicioresuelto.js"></script>
</body>
</html>
